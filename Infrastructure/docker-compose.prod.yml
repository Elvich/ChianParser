services:
  backend:
    build:
      context: ../Backend
      dockerfile: ../Infrastructure/Dockerfile.backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://chian:chian@db:5432/chianparser
    volumes:
      - ./updates:/app/updates
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chian
      POSTGRES_PASSWORD: chian
      POSTGRES_DB: chianparser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chian -d chianparser"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
