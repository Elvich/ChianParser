name: macOS App Continuous Delivery

on:
  push:
    branches: [ "main" ]
    paths:
      - "App/**"
      - ".github/workflows/release-cd.yml"

permissions:
  contents: write

jobs:
  build_sign_deploy:
    name: Сборка, подпись и авто-деплой DMG в прод
    runs-on: macos-14

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Выбор версии Xcode
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'




      # 3. Кэширование SPM зависимостей
      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('App/ChianParser.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 4. Развертывание Sparkle приватного ключа из Secrets
      - name: Setup Sparkle Private Key
        run: |
          if [ -z "${{ secrets.SPARKLE_PRIVATE_KEY }}" ]; then
            echo "❌ Ошибка: секрет SPARKLE_PRIVATE_KEY не задан в GitHub Secrets!"
            exit 1
          fi
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > .sparkle_private_key
          chmod 600 .sparkle_private_key

      # 5. Запуск скрипта сборки и подписи DMG
      - name: Build and Sign DMG Package
        run: |
          chmod +x App/create_dmg.sh
          ./App/create_dmg.sh

      # 6. Заливка собранного DMG и манифеста latest.json на продакшн сервер по SCP
      - name: Deploy DMG and latest.json to Production
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. Записываем оригинальный ключ во временный файл raw_key
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > raw_key
          
          # 2. Определяем тип ключа из первой строки (например, OPENSSH PRIVATE KEY или RSA PRIVATE KEY)
          # Очищаем от лишних дефисов по бокам (если пользователь случайно скопировал лишние дефисы)
          FIRST_LINE=$(head -n 1 raw_key)
          KEY_TYPE=$(echo "$FIRST_LINE" | sed -E 's/^-+BEGIN //; s/ -+$//; s/-+$//')
          
          # 3. Вырезаем base64 тело ключа (удаляем первую и последнюю строки)
          # Очищаем от любых случайных пробелов, табов и пустых строк
          BODY=$(sed '1d;$d' raw_key | tr -d '[:space:]')
          
          # 4. Собираем идеальный ключ с ровно 5 дефисами по краям и форматированием строк
          echo "-----BEGIN $KEY_TYPE-----" > ssh_key
          echo "$BODY" | fold -w 70 >> ssh_key
          echo "-----END $KEY_TYPE-----" >> ssh_key
          chmod 600 ssh_key
          rm -f raw_key
          
          # Безопасная диагностика формата восстановленного ключа (без вывода секретных данных)
          echo "🔍 Диагностика восстановленного SSH-ключа:"
          echo "Размер файла: $(wc -c < ssh_key) байт"
          echo "Количество строк: $(wc -l < ssh_key)"
          echo -n "Первая строка (маскированная): "
          head -n 1 ssh_key | sed 's/[A-Za-z0-9]/x/g'
          echo -n "Последняя строка (маскированная): "
          tail -n 1 ssh_key | sed 's/[A-Za-z0-9]/x/g'
          
          DMG_FILE=$(ls App/*.dmg | head -n 1)
          LATEST_JSON="App/latest.json"
          
          echo "📤 Отправка файлов по SCP..."
          scp -i ssh_key -P ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=no "$DMG_FILE" "$LATEST_JSON" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}/"
          
          rm -f ssh_key

      # 7. Создание релиза в GitHub и загрузка DMG-пакета в Release Assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            App/*.dmg
            App/latest.json
          tag_name: latest
          name: Latest Release Build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
