name: macOS App Continuous Delivery

on:
  push:
    branches: [ "main" ]
    paths:
      - "App/**"
      - ".github/workflows/release-cd.yml"

jobs:
  build_sign_deploy:
    name: Сборка, подпись и авто-деплой DMG в прод
    runs-on: macos-14

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Выбор версии Xcode
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      # 2.3 Установка Metal Toolchain (требуется для компиляции mlx-swift на macOS 14)
      - name: Install Metal Toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain



      # 3. Кэширование SPM зависимостей
      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('App/ChianParser.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 4. Развертывание Sparkle приватного ключа из Secrets
      - name: Setup Sparkle Private Key
        run: |
          if [ -z "${{ secrets.SPARKLE_PRIVATE_KEY }}" ]; then
            echo "❌ Ошибка: секрет SPARKLE_PRIVATE_KEY не задан в GitHub Secrets!"
            exit 1
          fi
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > .sparkle_private_key
          chmod 600 .sparkle_private_key

      # 5. Запуск скрипта сборки и подписи DMG
      - name: Build and Sign DMG Package
        run: |
          chmod +x App/create_dmg.sh
          ./App/create_dmg.sh

      # 6. Заливка собранного DMG и манифеста latest.json на продакшн сервер по SCP
      - name: Deploy DMG and latest.json to Production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "App/*.dmg,App/latest.json"
          target: ${{ secrets.SSH_TARGET_DIR }}
          strip_components: 1
