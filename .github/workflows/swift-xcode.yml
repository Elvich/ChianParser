name: macOS App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: macos-14

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Выбор версии Xcode
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'



      # 2.5 Кэширование SPM зависимостей для ускорения сборки
      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('App/ChianParser.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 3. Разрешение зависимостей (Swift Package Manager)
      - name: Resolve Swift Packages
        working-directory: App
        run: xcodebuild -resolvePackageDependencies -project "ChianParser.xcodeproj"

      # 4. Сборка и прогон тестов (Unit- и UI-тестов)
      - name: Build and Test
        working-directory: App
        run: |
          xcodebuild clean build test \
            -project "ChianParser.xcodeproj" \
            -scheme "ChianParser" \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
